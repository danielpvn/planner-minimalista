<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181926" />
      <stop offset="50%" stop-color="#0f1017" />
      <stop offset="100%" stop-color="#07080c" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b3d54" />
      <stop offset="100%" stop-color="#181924" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base App Tile -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Inner Subtle Glow Frame -->
  <rect x="48" y="48" width="416" height="416" rx="92" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="2" />

  <!-- Central Focus & Checkmark Symbol with Glow -->
  <g filter="url(#shadow)">
    <!-- Minimalist Calendar Ring / Circle -->
    <circle cx="256" cy="256" r="140" fill="none" stroke="#252738" stroke-width="12" stroke-dasharray="6 14" />
    
    <!-- Active Arc Progress -->
    <path d="M 256 116 A 140 140 0 0 1 396 256" fill="none" stroke="url(#glowGrad)" stroke-width="14" stroke-linecap="round" />

    <!-- Minimalist Checkmark -->
    <path d="M 196 260 L 238 302 L 324 206" fill="none" stroke="url(#glowGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Sparkle / Star Node -->
    <polygon points="396,170 402,186 418,192 402,198 396,214 390,198 374,192 390,186" fill="#a5b4fc" />
  </g>
</svg>
